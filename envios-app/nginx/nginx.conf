worker_processes 1;
events { worker_connections 1024; }

http {
  log_format json_log escape=json
    '{"hora":"$time_iso8601","ip":"$remote_addr","metodo":"$request_method",'
    '"ruta":"$uri","codigo":$status,"upstream":"$upstream_addr",'
    '"instancia":"$upstream_http_x_instance_id","ms":"$request_time"}';

  # Solo se limita POST; GET /health tiene clave vacia y no se limita
  map $request_method $clave_limite {
    POST    $binary_remote_addr;
    default "";
  }
  limit_req_zone $clave_limite zone=envios_zona:10m rate=2r/s;
  limit_req_status 429;

  map $status $es_rechazo {
    429     1;
    default 0;
  }

  upstream backend {
    server app1:3000 max_fails=1 fail_timeout=5s;
    server app2:3000 max_fails=1 fail_timeout=5s;
    server app3:3000 max_fails=1 fail_timeout=5s;
  }

  server {
    listen 80;
    access_log /var/log/nginx/access.json json_log;
    access_log /var/log/nginx/rechazos-429.json json_log if=$es_rechazo;

    location = /envios {
      limit_req zone=envios_zona burst=4 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
x-app: &app
  image: ${DOCKERHUB_USER}/envios-app:${IMAGE_TAG}
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy

x-app-env: &app-env
  DB_HOST: db
  DB_PORT: 5432
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME: ${DB_NAME}
  DELAY_MS: ${DELAY_MS:-0}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2

  app3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app1
      - app2
      - app3

volumes:
  pgdata: